    <text x="0" y="74" fill="#71666D" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Academic Tuition Ledger &amp; Digital Receipt System</text>
    <rect x="-160" y="100" width="320" height="34" rx="17" fill="#FFFFFF" stroke="#E5D1D0" stroke-width="1.5"/>
